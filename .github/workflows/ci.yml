name: ci

on:
  workflow_dispatch:
    inputs: {}
  push:
    branches: [main]
  pull_request:

# Unprivileged only. The netns/TUN end-to-end suite is guarded by the `e2e`
# build tag and is never compiled or run here (it needs root + /dev/net/tun).
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pin to the project toolchain (go.mod / flake dev shell). A newer
          # toolchain's stdlib source crashes staticcheck's IR builder in
          # golangci-lint 2.12.2 (honnef.co/go/tools v0.7.0); keep the Go and
          # golangci-lint pins in sync when bumping either.
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: frontend typecheck and test
        working-directory: web
        run: npm ci && npm run typecheck && npm test

      - name: build
        run: go build ./...

      - name: vet
        run: |
          go vet ./...
          # v1.0.4 tun/netstack is excluded: its pinned gVisor module is not
          # Go-module-buildable (upstream #156), and wanbond does not import it.
          (cd third_party/amneziawg-go && go vet ./device/...)

      - name: test
        run: |
          go test ./...
          (cd third_party/amneziawg-go && go test ./device/...)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint v2 matches .golangci.yml (version: "2") and the version
          # pinned in the flake dev shell — keep in sync with flake.nix.
          # goinstall builds it with the workflow's Go toolchain, so the binary's
          # language version always satisfies go.mod (action@v6 resolved a
          # go1.24-built v1-line binary that refused to run against go 1.26.4).
          version: v2.12.2
          install-mode: goinstall
